# Build standalone executables (Windows/macOS/Linux) and upload to release
name: Build and Release Executables

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check syntax
        run: python -m py_compile hash_check.py

  build:
    name: Build ${{ matrix.os-name }} executable
    runs-on: ${{ matrix.os }}
    needs: validate
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            output-name: hash-check.exe
            artifact-name: hash-check-windows-x64.exe

          - os: macos-latest
            os-name: macOS
            output-name: hash-check
            artifact-name: hash-check-macos-x64

          - os: ubuntu-latest
            os-name: Linux
            output-name: hash-check
            artifact-name: hash-check-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name hash-check hash_check.py

      - name: Verify executable
        run: |
          if [ ! -f "dist/${{ matrix.output-name }}" ]; then
            echo "❌ ERROR: Executable not created"
            exit 1
          fi
          echo "✅ Built: ${{ matrix.output-name }}"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.output-name }}
          retention-days: 7

  release:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    env:
      TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: List artifacts
        run: find release-files -type f -exec ls -lh {} \;

      - name: Flatten downloaded artifacts
        run: |
          mkdir -p release-files-flat
          # Copy every file found in the downloaded artifact folders into a single flat folder
          find release-files -type f -exec cp {} release-files-flat/ \;

      - name: List flattened files
        run: ls -lh release-files-flat || true

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          artifacts: release-files-flat/*
          allowUpdates: true
          artifactErrorsFailBuild: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
