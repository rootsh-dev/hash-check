# Python package CI + build -> upload dist/* to GitHub Release
# Triggers on: push tags (e.g. v1.2.3), release published, or manual dispatch.
name: Python package — test, build, upload release assets

on:
  push:
    tags:
      - 'v*'                # run when pushing tags like v1.2.3
  release:
    types: [published]     # run when a Release is published
  workflow_dispatch:       # allow manual run

concurrency:
  group: python-package-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (matrix)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']  # ✅ QUOTED to prevent float truncation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip & install base build tools
        run: python -m pip install --upgrade pip build wheel setuptools

      - name: Install dependencies (pyproject.toml or requirements.txt)
        run: |
          if [ -f "pyproject.toml" ]; then
            # try to install test extras if defined, otherwise editable install
            python -m pip install -e ".[test]" || python -m pip install -e .
          elif [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          else
            echo "⚠️  No pyproject.toml or requirements.txt found — skipping dependency install"
          fi

      - name: Run tests
        run: |
          if command -v pytest >/dev/null 2>&1; then
            echo "Running pytest..."
            pytest -q || exit 1  # ✅ Fail explicitly if pytest fails
          else
            echo "⚠️  pytest not found; checking for test_*.py files..."
            if find . -maxdepth 1 -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
              echo "❌ Test files found but pytest not installed!"
              exit 1
            fi
            echo "✅ No test files found; skipping"
          fi

  build-and-upload:
    name: Build / Upload release assets
    runs-on: ubuntu-latest
    needs: test
    if: |
      startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    env:
      # when triggered from a release event, use the release tag; otherwise use the pushed tag
      TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Upgrade pip and install build tools
        run: python -m pip install --upgrade pip build wheel setuptools

      - name: Validate build configuration exists
        run: |
          if [ ! -f "setup.py" ] && [ ! -f "pyproject.toml" ] && [ ! -f "setup.cfg" ]; then
            echo "❌ ERROR: No build configuration found (setup.py, pyproject.toml, or setup.cfg required)"
            exit 1
          fi

      - name: Clean previous builds
        run: rm -rf dist build *.egg-info || true

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel -o dist

      - name: List built artifacts
        run: |
          if [ -z "$(ls -A dist)" ]; then
            echo "❌ ERROR: No artifacts in dist/ directory after build"
            exit 1
          fi
          echo "✅ Built artifacts:"
          ls -al dist

      - name: Verify TAG_NAME is set
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "❌ ERROR: TAG_NAME is empty. Ensure release has a git tag."
            exit 1
          fi
          echo "📦 Will upload to tag: $TAG_NAME"

      - name: Create or upload to GitHub Release (upload dist/*)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          files: dist/*
          allowUpdates: true  # ✅ Allow re-uploading if release exists
          artifactErrorsFailBuild: true  # ✅ Fail if artifacts can't be uploaded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
